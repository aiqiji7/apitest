<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI API 特殊调用测试</title>
  <link rel="icon" href="assets/favicon.svg?v=20260717" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/styles.css?v=20260826b" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>AI API 特殊调用测试</h1>
      <p>测试 OpenAI/Anthropic/Google 等厂商 API 的特殊调用方式（工具调用、搜索、URL 上下文）</p>
      <p class="subnote">纯前端网页，所有信息仅存储在您的浏览器本地</p>
    </header>

    <main class="main-card">
      <section class="config-section">
        <div class="config-header">
          <h2>API 配置</h2>
          <div class="btn-group">
            <button class="btn btn-secondary" id="manageConfigBtn">管理配置</button>
          </div>
        </div>

        <div class="grid-3 input-row">
          <div class="input-group url-input-group">
            <label for="apiUrl">API URL</label>
            <div class="url-input-wrapper">
              <input type="text" id="apiUrl" placeholder="例如：https://api.openai.com" />
              <span id="httpWarningIcon" class="http-warning-icon" role="alert" aria-label="检测到 HTTP 地址，需要配置 HTTPS 代理" title="检测到 HTTP 地址，需要配置 HTTPS 代理才能在 HTTPS 页面访问" style="display:none;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
              </span>
              <button type="button" id="showRecentConnectionsBtn" class="model-fetch-btn recent-connections-btn" title="暂无最近连接" aria-label="展开最近连接列表" aria-controls="recentDropdown" aria-haspopup="listbox" aria-expanded="false" disabled>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 7h16"/>
                  <path d="M4 12h16"/>
                  <path d="M4 17h10"/>
                </svg>
              </button>
            </div>
            <div id="proxyToggle" class="proxy-toggle" role="button" tabindex="0" aria-expanded="false" aria-controls="httpProxyRow">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
              <span>设置代理</span>
            </div>
            <div id="httpProxyRow" class="proxy-row collapsed">
              <input type="text" id="httpProxyUrl" placeholder="HTTPS 代理地址，例如：https://your-proxy.workers.dev" />
              <span class="proxy-label">代理</span>
            </div>
            <div id="recentDropdown" class="recent-dropdown" role="listbox" style="display:none;"></div>
          </div>
          <div class="input-group">
            <label for="apiKey">API Key</label>
            <div class="password-input-wrapper">
              <input type="password" id="apiKey" placeholder="例如：sk-xxxxxxxxxxxx" />
              <button type="button" class="password-toggle" data-target="apiKey" aria-label="显示/隐藏密码">
                <svg class="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
                <svg class="eye-off-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                  <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="input-group model-input-group">
            <label for="model">模型</label>
            <div class="model-input-wrapper">
              <input type="text" id="model" placeholder="例如：gpt-4o" />
              <button type="button" id="fetchModelsBtn" class="model-fetch-btn" title="从 API 获取模型列表">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
              </button>
            </div>
            <div id="modelDropdown" class="model-dropdown" style="display:none;"></div>
            <div class="thinking-controls" id="thinkingControls">
              <div class="thinking-row">
                <label class="thinking-toggle-label" id="thinkingToggleLabel">
                  <input type="checkbox" id="thinkingToggle" />
                  <span class="toggle-slider"></span>
                  <span class="toggle-text">思考等级</span>
                </label>
                <div class="effort-select-wrapper" id="effortSelectWrapper" style="display:none;">
                  <button type="button" class="effort-select-btn" id="effortSelectBtn">None</button>
                  <div class="effort-dropdown" id="effortDropdown" style="display:none;"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="test-section">
        <div class="test-controls">
          <h2>测试内容</h2>
          <p class="muted">在下方选择测试类型，编辑用户消息，然后发送请求。结果将按轮次与请求分块展示。</p>

          <div class="stream-toggle-row">
            <label class="stream-toggle-label">
              <input type="checkbox" id="streamToggle" checked />
              <span>流式响应</span>
            </label>
            <span class="stream-toggle-hint">关闭后工具调用场景使用非流式 JSON 响应</span>
          </div>

          <div class="segmented" id="vendorType">
            <button class="seg-btn active" data-vendor="openai">OpenAI</button>
            <button class="seg-btn" data-vendor="anthropic">Anthropic</button>
            <button class="seg-btn" data-vendor="google">Google</button>
            <button class="seg-btn" data-vendor="images">Images</button>
          </div>
          <div class="segmented" id="openaiProtocol" style="display:none;">
            <button class="seg-btn active" data-protocol="chat_completions">Chat Completions</button>
            <button class="seg-btn" data-protocol="responses">Responses</button>
          </div>
          <div class="segmented" id="testType">
            <!-- 由JS动态渲染 -->
          </div>

          <div class="input-group">
            <label for="userInput">用户消息</label>
            <textarea id="userInput" class="input-textarea" rows="2" placeholder="请输入本次测试的用户消息"></textarea>
          </div>

          <!-- 图片输入区域 -->
          <div id="imageInputArea" class="input-group image-input-area" style="display:none;">
            <label>测试图片</label>
            <div class="image-input-row">
              <label class="file-upload-btn">
                <input type="file" id="imageFileInput" accept="image/*" />
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
                选择图片
              </label>
              <span class="input-sep">或</span>
              <input type="text" id="imageUrlInput" class="url-input" placeholder="输入图片 URL" />
            </div>
            <div id="imagePreview" class="image-preview" style="display:none;">
              <img id="previewImg" />
              <div class="image-preview-actions">
                <span id="imageInfo" class="image-info"></span>
                <button type="button" id="removeImageBtn" class="btn btn-secondary image-remove-btn">移除</button>
              </div>
            </div>
          </div>

          <div class="btn-row">
            <button class="btn btn-primary" id="testBtn">发送测试请求</button>
            <button class="btn" id="clearBtn">清空结果</button>
            <div id="waitingContainer" class="waiting-container"></div>
          </div>
        </div>

        <div class="split-columns">
          <div class="column" id="timelineColumn">
            <h3>轮次与消息</h3>
            <div id="messageTimeline" class="timeline"></div>
          </div>
          <div class="column" id="blocksColumn">
            <h3>请求与响应</h3>
            <div id="blocksContainer" class="blocks-container"></div>
            <div id="htmlPreviewSection" class="html-preview-section" style="display:none;">
              <div class="html-preview-header">
                <span class="html-preview-title">HTML 预览</span>
                <button type="button" id="htmlPreviewToggle" class="html-preview-toggle">收起</button>
              </div>
              <div id="htmlPreviewContainer" class="html-preview-container"></div>
            </div>
          </div>
        </div>

        <div id="errorMessage" class="error-message"></div>
      </section>
    </main>
  </div>

  <!-- 配置管理模态框 -->
  <div id="configModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="configModalTitle">管理 API 配置</h2>
        <span class="close" id="closeConfigModal">&times;</span>
      </div>

      <div class="config-modal-body">
        <div class="modal-left">
          <h3 id="modalFormHeading" class="subheading">添加新配置</h3>

          <div class="input-group">
            <label for="configName">配置名称</label>
            <input type="text" id="configName" placeholder="例如：生产环境" />
          </div>

          <div class="input-group">
            <label for="configUrl">API URL</label>
            <input type="text" id="configUrl" placeholder="例如：https://api.openai.com" />
          </div>

          <div class="input-group">
            <label for="configKey">API Key</label>
            <div class="password-input-wrapper">
              <input type="password" id="configKey" placeholder="例如：sk-xxxxxxxxxxxx" />
              <button type="button" class="password-toggle" data-target="configKey" aria-label="显示/隐藏密码">
                <svg class="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
                <svg class="eye-off-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                  <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="input-group">
            <label for="configModel">默认模型</label>
            <input type="text" id="configModel" placeholder="例如：gpt-4o" />
          </div>

          <div class="modal-actions">
            <button class="btn btn-primary" id="saveAsDefaultBtn">保存为默认配置</button>
            <button class="btn btn-secondary" id="saveConfigBtn">保存配置</button>
            <button class="btn btn-secondary" id="cancelEditBtn" style="display:none;">取消编辑</button>
          </div>
        </div>

        <div class="modal-right">
          <h3 class="subheading">已有配置</h3>
          <div class="config-list" id="configList"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/config.js?v=20260625"></script>
  <script src="assets/js/script.js?v=20260826c"></script>
</body>
</html>
